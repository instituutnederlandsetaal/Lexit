<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Aged parchment background -->
  <rect x="20" y="20" width="160" height="160" fill="#F4E4BC" rx="5"/>
  
  <!-- Decorative border -->
  <rect x="30" y="30" width="140" height="140" fill="none" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Corner flourishes -->
  <path d="M30 30 C40 40, 50 40, 60 30" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M140 30 C130 40, 120 40, 110 30" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M30 170 C40 160, 50 160, 60 170" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M140 170 C130 160, 120 160, 110 170" stroke="#8B4513" stroke-width="2" fill="none"/>
  
  <!-- Antique book -->
  <path d="M60 60 Q100 55, 140 60 L140 140 Q100 145, 60 140 Z" fill="#8B4513"/>
  <path d="M100 55 L100 145" stroke="#F4E4BC" stroke-width="2"/>
  
  <!-- Calligraphic text elements -->
  <path d="M75 85 Q80 85, 85 82" stroke="#F4E4BC" stroke-width="2" fill="none"/>
  <path d="M75 95 Q85 95, 90 92" stroke="#F4E4BC" stroke-width="2" fill="none"/>
  <path d="M75 105 Q80 105, 85 102" stroke="#F4E4BC" stroke-width="2" fill="none"/>
  
  <path d="M115 85 Q120 85, 125 82" stroke="#F4E4BC" stroke-width="2" fill="none"/>
  <path d="M115 95 Q125 95, 130 92" stroke="#F4E4BC" stroke-width="2" fill="none"/>
  <path d="M115 105 Q120 105, 125 102" stroke="#F4E4BC" stroke-width="2" fill="none"/>
  
  <!-- Decorative quill -->
  <path d="M70 40 Q90 45, 110 35" stroke="#8B4513" stroke-width="3" fill="none"/>
  <path d="M110 35 L115 33" stroke="#8B4513" stroke-width="1" fill="none"/>
</svg>
