  <rect x="20" y="20" width="160" height="160" fill="#2A3D66" rx="20"/>
  
  <!-- Stylized open book pages -->
  <path d="M60 70 L100 60 L140 70 L140 130 L100 140 L60 130 Z" fill="#F5F5F5"/>
