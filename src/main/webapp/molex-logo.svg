  <!-- Abstract text lines -->
  <line x1="70" y1="85" x2="90" y2="85" stroke="#2A3D66" stroke-width="3"/>
  <line x1="70" y1="95" x2="90" y2="95" stroke="#2A3D66" stroke-width="3"/>
  <line x1="70" y1="105" x2="85" y2="105" stroke="#2A3D66" stroke-width="3"/>
  
  <line x1="110" y1="85" x2="130" y2="85" stroke="#2A3D66" stroke-width="3"/>
  <line x1="110" y1="95" x2="130" y2="95" stroke="#2A3D66" stroke-width="3"/>
  <line x1="110" y1="105" x2="125" y2="105" stroke="#2A3D66" stroke-width="3"/>
  
  <!-- Letter L -->
  <path d="M85 40 L85 50 L115 50" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round"/>
</svg>
