	-->
		
	<!-- 
	
	Lex'it javascript functions are spread among different name spaces:
	
	cm  : Context menus
	conf: Configurator (process configuration)
	fn	: User Functions, the functions designed to configurate the client
	gui : Graphic User Interface functions
	head: Table header
	kf  : Key functions
	mt	: Multitable (table properties registration, taking care 
	      of doing that for more than one table at once)
	refr: Refresh table when browser tab is regaining focus 
	row : Row selection
	sf  : Search functions
	ssr	: simple search and replace function
	tb	: Table Builder, builds the table html frame 
	      and the Datatable object
	td  : Functions about table details
	ts  : Functions about table selection
	un	: Undo function
	-->

	<script type="text/javascript"  charset="utf-8">
	
	// *********************************************************************************************************
	
	// CONSTANTS
	
	var neutralValue = "Kies een tabel";
	var neutralColumnValue = "Alles";
	
	// INL Home url, as a regex like: /(...)/
	// current value should catch both 'inl' as 'ivdnt' domains
	var INL_HOMEURL = /(inl\.loc|ivdnt\.loc|localhost)/;
	
	// base url for all http requests
	var BASE_URL = "../lexit2";
	var WEBSERV_URL = BASE_URL + "/webservice";
	
	// Argument separator within single string 
	// this will be loaded from webservice (so we're sure the same value is used both in client and server)
	// It will be set by setInternalSeparator() at initialization time
	var ARG_INTERNAL_SEPARATOR = null;
	
	// Data type returned by database when a field type is user-defined
	var USER_DEFINED = "USER-DEFINED";
	
	// Name of user that has logged in, and its session-ID. This is set by fn.setCurrentUser() at initialization time
	var USERNAME = null;
	var SESSION_ID = null;
	
	// *********************************************************************************************************
	
	// configuration file variables
	var oTableSettingsList;
	var oHiddenTablesList;
	var oTableConfigurationList;
	var aFullConfigFilesList = 	new Array(); 	// list of projects config files on server
	
	// spy datatables object
	var oSpyTable;
	
	// about the database
	var asTableNames = 			new Array();	// list of database tables names	
	var asTableDescriptions =	new Array();	// list of database tables descriptions (visible to user)
	var asTableComments = 		new Array();    // list of database tables comments (in the GUI called 'notities'),
												// that can be typed in by clicking onto the table name (in the table header) in the GUI, 
												// and which are also visible through html 'title' attribute
	var asTableTypes = 			new Array();	// list of database tables types ('base table', 'view')
	var abTableVisible = 		new Array();	// list of database tables visibility (available to user)	
		
	// state variables
	var originalBgColor;
	
	// tooltips in table allowed by user or not (default is true)
	var bTooltipsAllowedInTable = true;
	
	// Should we compute quick estimates (for sake of speed) ?
	// Yes we do, so the value is 'false', 
	// but this might be temporarily manually set to 'true' by user (for a table refresh)
	var bForceExactCount = false;
	
	// In case only one single table is available to the user to choose from,
	// this table will be opened automatically (default value 'true')
	// This behaviour can be switched off by calling fn.preventAutomaticStartup() in config.js file
	var bOpenSingleTableAtStartup = true;

	// If some action needs to be performed (eg. to restore a given situation)
	// as soon as a tab regains or looses focus, some function can be declared to do so,
	// by calling fn.doAtFocusGain(). The function will be store in this variable.
	// (default is null)
	var fnDoAtFocusGain;
	var fnDoAtFocusLoss;
	
	// http parameters	
	var paramsHash;
	
	// go-to funtion parameter (all info at Database.getRowNumberOfRecord)
	var aGoToRowIds = {};
	
	
	// booleans: which mode are we running?
	var bTest;				// test mode
	var bSpyMode;			// global spy mode (who's logged in?)
	var bResetUserRights;	// reset user rights mode

	// are we on Mac or PC?
	var isMac = navigator.platform.toUpperCase().indexOf('MAC')>=0;
	
	// tell IE won't work
	var msie = /MSIE|Trident/.test(window.navigator.userAgent);
		
	if (msie > 0){		
		alert("Internet Explorer is not supported.");
	}	

	
	// *********************************************************************************************************
	
	// Start up !
	
	
	$(document).ready(function() {
		
		// put INL logo
		$("#home_logo").html('<img src="'+BASE_URL+'/images/INT-logo.png" height="60px" width="136px">');
		
		// get http parameters
		paramsHash = getHttpParams();
		
		// set neutral internal separator
		setInternalSeparator();
		
		
		// -----------------------------------------------------
		// Compute mode
		
		// Are we in development (test) mode?
		// if so, we'll be loading the file from webcontent (with $.getScript)
		// if not, we'll be loading the file from the configuration directory (with ajax call to webservice, which is the normal mode)
		
		bTest = (paramsHash!=null &&
				paramsHash.get("test")!=null && 
				paramsHash.get("test")=='true');		
		
		// are we getting a look into the active users list?
				
		bSpyMode = (paramsHash!=null &&
				paramsHash.get("db")!=null && 
				paramsHash.get("db")=='spy');		
		
		// are we resetting the user rights?
		 
		bResetUserRights = (paramsHash!=null &&
				paramsHash.get("db")!=null && 
				paramsHash.get("db")=='reset_user_rights');
		
		
		// -----------------------------------------------------
		
		
		// global spy mode (logging info)
		
		if (bSpyMode)
			{				
			buildSpy();
			}
		
		
		// reset user rights
		
		else if (bResetUserRights)
			{				
			var url = WEBSERV_URL+"/table/reset_user_rights"; 
			
			$.ajax({
				"type": "GET",
				"url": url,
				"data": {
					"dummy": getUniqueNumber()
				},
				"dataType": "xml", // get response as xml
				"success": function(xml) {
					var sResp = fn.getDbResponse(xml);
			 		fn.message("Reset", "Response: " + sResp);
			 		},
				"error": function(jqXHR, textStatus, errorThrown){
					
					fn.message("Fout",
							"Reset mislukt: " +	textStatus+" "+errorThrown);
					}
				});
			}
		
		
		// test mode (development)
		
		else if (bTest)
			{
			$.getScript("projects_overview.js")
			.done(function(){	
				
				// The ajax call gets the list of declared projects out of the projects overview file.
				// As a second step, we call a function which generates a list of all projects, as some might not have been declared.
				// In the end, this function will call initialize();
				getConfigFilesList();
				
				})
			.fail(function(jqxhr, settings, exception){
				fn.message("Fout", "Het projectenoverzicht 'projects_overview.js' bestaat niet of het bevat fouten.<br><br>Fout: ["+exception+"]<BR><BR>");
				});
			}
		
		
		
		// normal mode (production)
		
		else
			{
			var url = WEBSERV_URL+"/table/get_projects_overview"; 			
			
			$.ajax({
				"type": "GET",
				"url": url,
				"dataType": "script",
				"data": {
					"dummy": getUniqueNumber()
				},
				"success": function(){			
					
					// The ajax call gets the list of declared projects out of the projects overview file.
					// As a second step, we call a function which generates a list of all projects, as some might not have been declared.
					// In the end, this function will call initialize();
					getConfigFilesList();
					
				},
				"error": function(jqxhr, settings, exception){
					fn.message("Fout", "Het projectenoverzicht 'projects_overview.js' bestaat niet of het bevat fouten.<br><br>Fout: ["+exception+"]<BR><BR>");
				}
				
			});
			
			}
		
		
					
	});	 // end of start up
	
	
	// *********************************************************************************************************
	
	
	// called by $(document).ready()
	
	
		
	// spy mode
		
	function buildSpy(){
		
		var url = WEBSERV_URL+"/table/get_users"; 			
		
		$.ajax({
			type: "GET",
			url: url,
			data: {},
			dataType: "xml",
			contentType: "application/x-www-form-urlencoded;charset=UTF-8",
			success: function(xml) {
				
				// build the table if it doesn't exist yet
				if ( !$("#spytable").elementExists() )
					{
					var spyDiv = $("<div></div>")
					.attr("id", "#spytable");
				
					var spyTable = $("<table></table>")
						.attr("id", "spytable")
						.addClass("display")
						.attr("cellspacing", "0")
						.css("width", "90%");
					
					var thead = $("<thead></thead>");
					var thead_tr = $("<tr></tr>");
					thead_tr.append( $("<th></th>").text("project_name") );
					thead_tr.append( $("<th></th>").text("active_user") );
					thead_tr.append( $("<th></th>").text("session_id") );
					thead_tr.append( $("<th></th>").text("active_tab") );
					thead_tr.append( $("<th></th>").text("last_active") );
					thead_tr.append( $("<th></th>").text("status") );
					thead.append(thead_tr);
					spyTable.append(thead);
					
					var tfoot = $("<tfoot></tfoot>");
					var tfoot_tr = $("<tr></tr>");
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot.append(tfoot_tr);
					spyTable.append(tfoot);
					
					var tbody = $("<tbody></tbody>");
					
					spyTable.append(tbody);
					spyDiv.append(spyTable);				
					$("#dynamic").append(spyDiv);
					
					spyDiv
					.css("position", "absolute")
					.css("top", "100px")				
					.css("width", "80%");
					
					oSpyTable = $('#spytable').DataTable({
						"dom": '<"top"f>t',
						"pageLength": 100
						}).column(2).order('desc').draw();
					
					}
				
				// remove rows from previous cycle
				oSpyTable.rows().remove();
				
				// add the current info to the table
				$(xml).find("user").each(function(){
					
					var UsersItems = $(this).find("item");
					
					oSpyTable.row.add([
						UsersItems.eq(0).text(),
						UsersItems.eq(1).text(),
						UsersItems.eq(2).text(),
						UsersItems.eq(3).text(),
						UsersItems.eq(4).text(),
						UsersItems.eq(5).text()
						]);
					});
				
				// sort by column 'last_active'
				oSpyTable.draw();					
				
				// refresh after few seconds
				setTimeout(function(){ buildSpy(); }, 2000);
				},
			error: function(jqXHR, textStatus, errorThrown){
				fn.message("Fout", "XML laden mislukt: "+textStatus+" "+errorThrown);
				}
		});
	};
	
	
	// get internal separator in use in webservice  
	// and set the same separator in this client
	
	function setInternalSeparator(){
		
		var url = WEBSERV_URL+"/table/get_neutral_separator"; 			
		
		$.ajax({
			"async": false, // needed to block code execution while awaiting the server response
			"type": "GET",
			"url": url,
			"dataType": "xml", // get response as xml
			"data": {
				"dummy": getUniqueNumber()
			},
			"success": function(xml){
				ARG_INTERNAL_SEPARATOR = fn.getDbResponse(xml);
			},
			"error": function(jqxhr, settings, exception){
				fn.message("Fout", "Het ophalen van de Interne separator string is mislukt.<br><br>Fout: ["+exception+"]");
			}
		});
	}

	// tell the webservice which tab is currently active
	// in the current session

	function sendActiveTabIdToService(sPageId){

		if (paramsHash == null || paramsHash.get("db") == null || paramsHash.get("db") == 'spy')
			return;

		var url = WEBSERV_URL+"/table/set_active_tab_id"; 

		$.ajax({
			"async": false, // needed to block code execution while awaiting the server response
			"type": "GET",
			"url": url,
			"dataType": "xml", // get response as xml
			"data": {
				"db_name": paramsHash.get("db"),
				"active_tab_id": sPageId,
				"dummy": getUniqueNumber()
			},
			"success": function(xml){
				// nothing to do
			},
			"error": function(jqxhr, settings, exception){
				fn.message("Fout", "Het registeren van de active tab is mislukt.<br><br>Fout: ["+exception+"]");
			}
		});
	}
	
	
	// Get full list of projects config files from server.
	// We'll need this to be able to show projects which are not declared (yet?) in the projects overview file:
	// the list will lack descriptions, but at least the projects will be shown and will be clickable!
	
	function getConfigFilesList(){
		
		var url = WEBSERV_URL+"/table/get_configfiles_list"; 			
		
		$.ajax({
			"type": "GET",
			"url": url,
			"dataType": "xml", // get response as xml
			"data": {
				"dummy": getUniqueNumber()
			},
			"success": function(xml){
				
				var sList = fn.getDbResponse(xml);
				aFullConfigFilesList = sList.split(ARG_INTERNAL_SEPARATOR);
				
				initialize();
			},
			"error": function(jqxhr, settings, exception){
				fn.message("Fout", "Het ophalen van de list configuratiebestanden is mislukt.<br><br>Fout: ["+exception+"]");
			}
		});
	}
	
	// end of : called by $(document).ready()
	
	
	
	// *********************************************************************************************************
	
	// Initialize the application.
	// This happens once the libraries are fully loaded and we have a list of all projects 
	// ( which is which this function will be called by getConfigFilesList )
	
	function initialize(){	
		
		// set current user name
		fn.setCurrentUser();
		
		// generate unique id for this page
		// we will need this to detect page focus/blur in a reliable way
		var sPageId = getUniqueNumber();
		$("#page_id").attr("name", sPageId);
		$.cookie('active_lexit_window', sPageId);
		sendActiveTabIdToService(sPageId);
		
		// user instruction for accessing tables
		$("#indicator").empty().append(
				$("<span></span>")
				.html("Kies een tabel: <I>(vooraf "+(isMac?"Command":"CTRL")+" ingedrukt houden om tabel toe te voegen, of SHIFT voor tabel in nieuwe tab)</I>")
				);
		
		// get url parameters		
		if (paramsHash == null || paramsHash.get("db") == null)
			{
			showListOfProjects();
			}
		else
			{			
			// Normal case: start opening project
		
			// Assign key functions
			// This needs to be called here because it has global scope
			// and recalling it at each new table creation will alter other key functions 
			// which then malfunction (because of unbinds)
			kf.addKeyFunctions();			
			
			
			// load the specific client configuration file for the required database
			// and get the list of tables (getScript never reads this file from cache)
			
			
			// test mode (development)
			if (bTest)
				{
				$.getScript(paramsHash.get("db")+".config.js")
				.done(function(){
					
					var oFiltersAndSettings = getTableFiltersAndSettings(paramsHash);
					ts.getListOfTables( paramsHash.get("table"), 
							oFiltersAndSettings.contentToMatch , oFiltersAndSettings.extraSettings  );
					
					// prevent Chrome bug (sometimes pressing backslash causes navigating away)
					if (bowser.chrome)
						$(window).bind('beforeunload', function(){   
							return false;
							});
					})
				.fail(function(jqxhr, settings, exception){
					fn.message("Fout", "Het configuratiebestand '<i>"+paramsHash.get("db")+"</i>' bestaat niet of het bevat fouten.<br><br>Fout: ["+exception+"]<BR><BR>");
					});
				}
			
			// normal mode (production)
			else
				{
				var url = WEBSERV_URL+"/table/get_configfile"; 			
				
				$.ajax({
					"type": "GET",
					"url": url,
					"dataType": "script",
					"data": {
						"db_name": paramsHash.get("db"),
						"dummy": getUniqueNumber()
					},
					"success": function(){
						
						var oFiltersAndSettings = getTableFiltersAndSettings(paramsHash);
						ts.getListOfTables( paramsHash.get("table"), 
								oFiltersAndSettings.contentToMatch , oFiltersAndSettings.extraSettings );
						
						// prevent Chrome bug (sometimes pressing backslash causes navigating away)
						if (bowser.chrome)
							$(window).bind('beforeunload', function(){   
								return false;
							});
					},
					"error": function(jqxhr, settings, exception){
						fn.message("Fout", "Het configuratiebestand '<i>"+paramsHash.get("db")+"</i>' bestaat niet of het bevat fouten.<br><br>Fout: ["+exception+"]<BR><BR>");
					}
					});
				}
			
			
			
			
			
			// show message or warning for this project, if available
			
			var oProjectObject = getProjectObject(paramsHash.get("db"));

			// set a default project name for display on screen (and set front character in uppercase)
			// this default name might be overwritten by configuration in project_overview.js, if some project 'name' was set there
			var sProjectName = paramsHash.get("db").substring(0,1).toUpperCase()+paramsHash.get("db").substring(1);

			if (typeof oProjectObject != 'undefined') {
				
				// message
				if (typeof oProjectObject["message"] != 'undefined') {
					var sWarning = oProjectObject["message"];
					var bPrivate = (typeof oProjectObject["private"] != 'undefined') ?
						oProjectObject["private"] : false; // default is 'false'
					var fnMsgCallback = (typeof oProjectObject["message_callback"] != 'undefined') ?
								oProjectObject["message_callback"] : null;
						 
					// show warning message if available
					if (	sWarning != '' &&   
							// except if it should be kept private to home
							!(bPrivate && (document.URL).regexIndexOf( INL_HOMEURL )<0 ) 
						)
						fn.message(paramsHash.get("db"), sWarning, fnMsgCallback);
				}
				
				// redirect to other URL (rare, but it has been required in the past)
				if (typeof oProjectObject["redirect"] != 'undefined') {
					window.location.href = oProjectObject["redirect"];
				}

				// is some project name was set, overwrite the default one
				if (typeof oProjectObject["name"] != 'undefined') {
					sProjectName = oProjectObject["name"];
				}
			}


			// show the project name at the top of the screen
			fn.setProjectTitle(sProjectName);
		}
		
	};

	// get table filters from url if available (... &filter_a=... & filter_b=...)
	function getTableFiltersAndSettings(paramsHash){
		
		var oContentToMatch = new Array();
		var oExtraSettings = new Array();
		for (var i=0; i<paramsHash.keys().length; i++)
			{
			var sOneParam = paramsHash.keys()[i];
			// read all parameters, except 'db' and 'table', since we process those elsewhere
			if ( $.inArray(sOneParam, ["db", "table"])<0 )
				{
				// table setting parameters
				if ($.startsWith(sOneParam, "setting."))
					{
					var sTrueSettingName = sOneParam.replace("setting.", "");
					oExtraSettings[sTrueSettingName] = paramsHash.get(sOneParam);					
					}
				// table filters
				else
					{
					oContentToMatch[sOneParam] = paramsHash.get(sOneParam);
					}				
				}
			}
		
		return { 
			contentToMatch: oContentToMatch,
			extraSettings: oExtraSettings
			};
	}
	
	
	
	
	// get technical database info and show it in a pop-up 
	function showDatabaseInfo(sDbName){
		
		var url = WEBSERV_URL+"/table/get_dbinfo"; 
		
		$.ajax({
			"type": "GET",
			"url": url,
			"data": {
				"db": sDbName,
				"dummy": getUniqueNumber()
			},
			"dataType": "xml", // get response as xml
			"success": function(xml) {
				var sResp = fn.getDbResponse(xml);
		 		fn.message("Database info", sResp);
		 		},
			"error": function(jqXHR, textStatus, errorThrown){
				
				fn.message("Fout",
						"'"+sDbName+"' heeft mogelijk geen configuratie-bestand meer op deze server: " +				
					textStatus+" "+errorThrown);
				}
			});
		
	}

	
	// generate a welcome page with a project overview 
	// (projects have to be declared and described in file 'projects_overview.js' so as to be show here)
	function showListOfProjects(){
		
		var sCurrentURL = document.URL;
		
		// keep this list private to internal environment
		if ( sCurrentURL.regexIndexOf( INL_HOMEURL )>-1 || bTest) {

			$("#indicator").empty().append(
				$("<span></span>")
					.html("<br><h2>Welkom in Lex'it</h2>Kies een project:<br><br>")
			);
			
			var docOpenTitle = $("<span></span>").html("<b>Productie</b>");
			var docOpen = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#D0F5A9");
			
			var goodiesTitle = $("<span></span>").html("<b>Goodies en tools</b>");
			var goodies = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#A9E2F3");
			
			var docDevelopmentTitle = $("<span></span>").html("<b>In ontwikkeling</b>");
			var docDevelopment = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#EFEFFB");
			
			var docClosedTitle = $("<span></span>").html("<b>Afgesloten</b>");
			var docClosed = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#F8E0E0");
			
			var docUnknownTitle = $("<span></span>").html("<b>Onbekend</b>");
			var docUnknown = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#F2F2F2");
			
			
			// process list of all config files
			var aKnownConfigFilesList = new Array();
			
			// get list of known projects in projects overview
			for (var i=0; i<aProjectList.length; i++) {
				aKnownConfigFilesList.push(aProjectList[i]["config_filename"]);				
			}
			
			// now, if some configfile is no part of the projects overview list, 
			// it will be added to it as part of the 'unknown projects' category
			// (so it will appear as such in the menu)
			for (var i=0; i<aFullConfigFilesList.length; i++) {
				var oneConfigFile = aFullConfigFilesList[i];
				if (aKnownConfigFilesList.indexOf(oneConfigFile) < 0) {
					aProjectList.push({
						"name": oneConfigFile,
						"config_filename": oneConfigFile,
						"description": "onbekend",
						"unknown": true
				 	});
				}
			}
			
			
			// build menu now!
			for (var i=0; i<aProjectList.length; i++){

				// set project name to be rendered and a project link to be clicked upon

				var sProjectLinkPart = aProjectList[i]["config_filename"];
				var sProjectLink = sCurrentURL.substring(0, sCurrentURL.indexOf("/lexit2"))+"/lexit2/?db="+sProjectLinkPart+( sCurrentURL.indexOf("test=true")>-1 ? "&test=true":"");
				var sProjectName = (typeof aProjectList[i]["name"] != 'undefined' ? aProjectList[i]["name"] : sProjectLinkPart);
				
				var sProjectDescription =
					"<td style='text-align: left; width: 10px'>"+
					(typeof aProjectList[i]["goody"] == 'undefined' ? 
							"<A style='text-decoration: none; color: #A4A4A4;' "+ 
							"   title='"+sProjectName+"' "+
							"   href='#' "+
							"   onclick='showDatabaseInfo(\""+sProjectLinkPart+"\"); return false;' "+
							"   target='_blank'>&#9830;</A>" : "")+
					"</td>"+
					"<td style='text-align: right; width: 400px'>"+
					"<A href='"+sProjectLink+"'><B>"+sProjectName+
					"</B></A></td><td>" +					 
					"</td>"+
					"<td style='text-align: left; width: 700px'>" +
					(typeof aProjectList[i]["description"] != 'undefined' && aProjectList[i]["description"] != "" ? 
						" : <I>"+aProjectList[i]["description"]+"</I>" : "") + 
					"</td>";
				
				var eProjectDiv = $("<tr></tr>").html(sProjectDescription);
				
				// Put the project in the right category:
				
				if (typeof aProjectList[i]["goody"] != 'undefined' && aProjectList[i]["goody"]) {
					goodies.append(eProjectDiv)
				}
					
				// project is closed
				else if (typeof aProjectList[i]["closed"] != 'undefined' && aProjectList[i]["closed"]) {
					docClosed.append(eProjectDiv)
				}
				
				// project is unknown
				else if (typeof aProjectList[i]["unknown"] != 'undefined' && aProjectList[i]["unknown"]) {
					docUnknown.append(eProjectDiv);
				}
				
				// project is open
				else {
					// production
					if (typeof aProjectList[i]["production"] != 'undefined' && aProjectList[i]["production"])
						docOpen.append(eProjectDiv);
					// development
					else
						docDevelopment.append(eProjectDiv);
				}
			}
			
			// make sure each table is still visible, when it's empty 
							
			$("#page").append(docOpenTitle);
			$("#page").append(_deEmptyMenuList(docOpen));
			$("#page").append($("<br>"));			
			$("#page").append(goodiesTitle);
			$("#page").append(_deEmptyMenuList(goodies));
			$("#page").append($("<br>"));
			$("#page").append(docDevelopmentTitle);
			$("#page").append(_deEmptyMenuList(docDevelopment));
			$("#page").append($("<br>"));
			$("#page").append(docClosedTitle);
			$("#page").append(_deEmptyMenuList(docClosed));	
			$("#page").append($("<br>"));
			$("#page").append(docUnknownTitle);
			$("#page").append(_deEmptyMenuList(docUnknown));
			
			
		}
		else {
			fn.message("Fout", "Geen toegang");
		}
		
	}
	
	// subroutine: make sure an empty menu list is visible, by addind an empty line
	function _deEmptyMenuList(docList){
		
		var eEmptyCell = "<td style='text-align: right; width: 400px'>&nbsp;</td>"+
		"<td>&nbsp;</td><td style='text-align: left; width: 700px'>&nbsp;</td>";
		var eEmptyLine = $("<tr></tr>").html(eEmptyCell);
		
		return ( !$(docList).find("tr").length ) ? docList.append(eEmptyLine) : docList;
		
	}
	
	
	// get all the properties belonging to the description of a project
	function getProjectObject(sDbName){
		
		var oObjectToReturn;
		
		for (var i=0; i<aProjectList.length; i++) {
			if (aProjectList[i]["config_filename"] != sDbName) {
				continue;
			}
			else {
				oObjectToReturn = new cloneObject(aProjectList[i]);
				break;
			}
		}
		return oObjectToReturn;
	}
