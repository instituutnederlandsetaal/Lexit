	<!-- 
	Javascript import with needed functionalities:
	
	jquery            : JS extension
	jquery.extensions : jQuery extension with handy functions like endsWith(), startsWith() etc
                        (https://bitbucket.org/mrshrinkray/jquery-extensions/wiki/Home)
    jQuery-contextMenu: jQuery context menu extension (works with 'prettify')
    					(http://medialize.github.com/jQuery-contextMenu/ 
						 https://github.com/medialize/jQuery-contextMenu) 
	dataTables        : Graphic user interface supporting table search, sorting, etc. for jQuery
	                    (http://datatables.net/)
	jeditable         : Edit In Place Plugin for jQuery
	                    (http://www.appelsiini.net/projects/jeditable)
	jshashtable       : reliable js implementation of HashMap
	                    (http://www.timdown.co.uk/jshashtable/)
	spin			  : good spinner
	                    (http://fgnass.github.com/spin.js/)
	tipTip		      : better tooltip function than standard html tooltips
	                    (http://code.drewwilson.com/entry/tiptip-jquery-plugin)
	util              : all kinds of utilities
	-->
		
	<!-- 
	
	Lex'it javascript functions are spread across different namespaces (check the jsdoc for details):
	
	cm  : 		Context menus functions
	conf: 		Configurator (process configuration)
	fn	: 		Functions targeting nodes (old DataTables API) 
	fx  : 		Functions targeting API-instances (new DataTables API)
	gui : 		Graphic User Interface functions
	head: 		Table header functions
	kf  : 		Key functions
	lang : 		Language support
	lexitinit: 	Initialization functions (at start up)
	lexitspy : 	Spy mode functions (active users and connections overview)
	lexitusers: Users management
	lexutil : 	Utilities
	mt	: 		Multitable (table properties registration, taking care 
	      		of doing that for more than one table at once)
	refr: 		Refresh table when browser tab is regaining focus 
	row : 		Row selection
	sf  : 		Search functions
	ssr	: 		Simple search and replace function
	tb	: 		Table Builder, builds the table html frame and the Datatable object (API-instance)
	td  : 		Functions about table details
	ts  : 		Functions about table selection
	un	: 		Undo function
	-->

	<script type="text/javascript"  charset="utf-8">
	
	// *********************************************************************************************************
	
	// CONSTANTS
	
	// INL Home url, as a regex like: /(...)/
	// current value should catch both 'inl' as 'ivdnt' domains
	var INL_HOMEURL = /(inl\.loc|ivdnt\.loc|localhost|172\.16\.)/;
	
	// base url for all http requests
	var BASE_URL = "../lexit2";
	var WEBSERV_URL = BASE_URL + "/webservice";
	
	// Argument separator within single string 
	// this will be loaded from the webservice (so we're sure the same value is used both in client and server)
	// It will be set by lexitinit.setInternalSeparator() at initialization time
	var ARG_INTERNAL_SEPARATOR = null;
	
	// Data type returned by database when a field type is user-defined
	var USER_DEFINED = "USER-DEFINED";
	
	// Name of user that has logged in, and its session-ID. This is set by fn.setCurrentUser() at initialization time
	var USERNAME = null;
	var SESSION_ID = null;

	// declaring the project list array here allows the 'project_config.js' file (in which it is supposed to be declared)
	// to be missing in a Lex'it installation, if convenient!
	var aProjectList = [];
	
	// *********************************************************************************************************
	
	// configuration file variables
	var oTableSettingsList;
	var oHiddenTablesList;
	var oTableConfigurationList;
	var aFullConfigFilesList = 	new Array(); 	// list of projects config files on server
	
	// spy datatables object
	var oSpyTable;
	
	// connections datatables object
	var oConnectionsTable;
	
	// about the database
	var asTableNames = 			new Array();	// list of database tables names	
	var asTableDescriptions =	new Array();	// list of database tables descriptions (visible to user)
	var asTableComments = 		new Array();    // list of database tables comments (in the GUI called 'notities'),
												// that can be typed in by clicking onto the table name (in the table header) in the GUI, 
												// and which are also visible through html 'title' attribute
	var asTableTypes = 			new Array();	// list of database tables types ('base table', 'view')
	var abTableVisible = 		new Array();	// list of database tables visibility (available to user)	
		
	// state variables
	var originalBgColor;
	
	// tooltips in table allowed by user or not (default is true)
	var bTooltipsAllowedInTable = true;
	
	// Should we compute quick estimates (for sake of speed) ?
	// Yes we do, so the value is 'false', 
	// but this might be temporarily manually set to 'true' by user (for a table refresh)
	var bForceExactCount = false;
	
	// In case only one single table is available to the user to choose from,
	// this table will be opened automatically (default value 'true')
	// This behaviour can be switched off by calling fn.preventAutomaticStartup() in config.js file
	var bOpenSingleTableAtStartup = true;
	// global variables to store the name of that single table and its filters/settings at startup time
	var sStartUpTable = "";
	var oStartUpContentToMatch = {};
	var oStartUpTableSettings = {};

	// If some action needs to be performed (eg. to restore a given situation)
	// as soon as a tab regains or looses focus, some function can be declared to do so,
	// by calling fn.doAtFocusGain(). The function will be store in this variable.
	// (default is null)
	var fnDoAtFocusGain;
	var fnDoAtFocusLoss;
	
	// http parameters	
	var paramsHash;
	
	// go-to funtion parameter (all info at Database.getRowNumberOfRecord)
	var aGoToRowIds = {};
	
	
	// booleans: which mode are we running?
	var bTest;				// test mode
	var bSpyMode;			// global spy mode (who's logged in?)
	var bAdmin;				// administrator mode
	var bResetUserRights;	// reset user rights mode

	// Lex'it language mode
	var sLexitLanguage;

	// font size memory
	var iFontSize = "100%";
	
	// set the location of the icons for the trumbowyg editor
	$.trumbowyg.svgPath = 'trumbowyg/icons.svg';

	// are we on Mac or PC?
	var isMac = navigator.platform.toUpperCase().indexOf('MAC')>=0;
	
	// tell some browsers are not supported
	if (bowser.msie || bowser.safari){		
		alert("This browser is not supported. Use Chrome, Edge or Firefox.");
	}	

	
	// *********************************************************************************************************
	
	// Start up !
	
	
	$(document).ready(function() {
		
		// Add huisstijl balk and title
		fn.setBalk(true, true, "favicon-klein.png", "50px");
		$("#projectname").html(`<span><a href="/lexit2">lex'it</a></span>`);
		
		// put INL logo
		$("#home_logo").html('<img src="'+BASE_URL+'/images/INT-logo.png" height="60px" width="136px">');
		
        
		// get http parameters
		paramsHash = lexutil.getHttpParams();

		// set language to be used
		sLexitLanguage = lang.getLanguageCode();
		lang.setLanguage(sLexitLanguage);
		
		// set neutral internal separator
		lexitinit.setInternalSeparator(function(){

			// compute mode
			lexitinit.computeOperatingMode();

			// set current user name
			// and start app in the right mode			
			fn.setCurrentUser(null, function(){
				
				// when a projectname is specified as URL param 'db', this function 
				// will call lexitmenu.startProjectOrGetConfigFilesList() and lexitinit.initialize() 
				// to start the project 
				lexitinit.startInRightMode();	
			});
			
		});
					
	});	
	
	
	// *********************************************************************************************************
		
	</script>
