	<!-- 
	
	Lex'it javascript functions are spread among different name spaces:
	
	cm  : Context menus
	conf: Configurator (process configuration)
	fn	: User Functions, the functions designed to configurate the client
	gui : Graphic User Interface functions
	head: Table header
	kf  : Key functions
	mt	: Multitable (table properties registration, taking care 
	      of doing that for more than one table at once)
	refr: Refresh table when browser tab is regaining focus 
	row : Row selection
	sf  : Search functions
	ssr	: simple search and replace function
	tb	: Table Builder, builds the table html frame 
	      and the Datatable object
	td  : Functions about table details
	ts  : Functions about table selection
	un	: Undo function
	lexitusers : users management
	lexutil : utilities
	-->

	// login function must be accessible from anywhere, to be able to call it programmatically if needed
	// ( synonym: fn.startLexitLogin() )
	function startLexitLogin(){
				
		fn.prompt("LOGIN", ["Username", "Password"], ["", ""], 
				function(resp){
			
					var url = WEBSERV_URL+"/api/login"; 
			
					$.ajax({
						"type": "POST",
						headers: {'Content-Type': 'application/x-www-form-urlencoded'},
			            contentType: 'application/x-www-form-urlencoded; charset=utf-8',

						"url": url,
						"data": {
							"username": resp["Username"],
							"password": resp["Password"],
							"dummy": getUniqueNumber()
						},
						"dataType": "xml", // get response as xml
						"success": function(xml) {
							var sResp = fn.getDbResponse(xml);
					 		if (sResp == 'Access denied'){
					 			fn.closeDialog();
					 			fn.message(sResp, sResp, function(){
					 				lexitReload();
					 			});
					 		}
					 		else {
					 			setTimeout(function(){lexitReload();}, 500);
					 		}
					 	},
						"error": function(jqXHR, textStatus, errorThrown){
							
							fn.message(lang.error, lang.failed+": " +	textStatus+" "+errorThrown);
						}
					});
			
				},
				function(){
					// if cancel then reload
					lexitReload();
					
				}
		);
		
		// set password type etc
		setTimeout(	function(){
			$("div[id^='dialog-message']").find("form").attr("id", "loginForm");
			$("div[id^='dialog-message']").find("input#prompt_username").attr("autocomplete", "username");
			$("div[id^='dialog-message']").find("input#prompt_password").attr("autocomplete", "current-password");
			
			$("div[id^='dialog-message']").find("input#prompt_password").attr("type", "password");
			fn._activeEnterForThisDialog( $("div[id^='dialog-message']").attr("id") );
			
			$("div[id^='dialog-message']").find("input#prompt_username").focus();
			
		}, 100); 
		
	};
	
	
	// logout function must be accessible from anywhere, to be able to call it programmatically if needed
	// ( synonym: fn.startLexitLogout() )
	function startLexitLogout(fnCallback){
		
		if (fn.getCurrentUser() == null){
			console.log("Username is already empty, which means that log out was performed already.");
			return;
		}		
		
		var url = WEBSERV_URL+"/api/logout";
		
		$.ajax({
			"type": "GET",
			"url": url,
			"data": {
				"username": fn.getCurrentUser(),
				"dummy": getUniqueNumber()
			},
			"dataType": "xml", // get response as xml
			"success": function(xml) {
				
				// reset!
				USERNAME = null;
				SESSION_ID = null;
				
				// if a callback was set, call it
				if (fnCallback != null){
					fnCallback();
				}
				else {
					fn.closeDialog();
		 			fn.message("Log out", fn.getDbResponse(xml), function(){
		 				lexitReload();
		 			});
				}
				
		 	},
			"error": function(jqXHR, textStatus, errorThrown){
				
				fn.message(lang.error, lang.failed+": " +	textStatus+" "+errorThrown);
			}
		});
		
	};

	// called by $(document).ready()

	
	function startInRightMode(){		
				 
		if (	// user tries to access a project other than the admin console
				!bAdmin && (paramsHash != null && paramsHash.get("db") != null) 
				&& 
				// and no user is logged in, or the user had proviously logged in as admin (which is the same, since that only allows access to admin console)
				(fn.getCurrentUser() == null || fn.getCurrentUser() == "null" || fn.getCurrentUser() == "admin")){
			
			// try to load a login page, if available / otherwise do normal login
			
			if (bTest) {
				$.getScript(paramsHash.get("db")+".welcome.js")
				.done(function(){					
					// no nothing, as the welcome page is supposed to start the lexit login programmatically
				})
				.fail(function(jqxhr, settings, exception){
					// if no welcome page is available, do normal login
					startLexitLogin();
				});
			}
			
			// normal mode (production)
			else {
				var url = WEBSERV_URL+"/api/get_welcome_page";
				
				$.ajax({
					"type": "GET",
					"url": url,
					"dataType": "script",
					"data": {
						"db_name": paramsHash.get("db"),
						"dummy": getUniqueNumber()
					},
					"success": function(response){						
						// if no welcome page available, do normal login
						if (response == 'NOT_AVAILABLE'){
							startLexitLogin();
						}
						// otherwise no nothing, as the welcome page is supposed to start the lexit login programmatically
					},
					"error": function(jqxhr, settings, exception){
						// if no welcome page is available, do normal login
						startLexitLogin();
					}
				});
			}
			
		}
		
		// admin mode (access to admin console only)
		
		else if (bAdmin) {
			
			fn.prompt("ADMIN LOGIN", ["Username", "Password"], ["admin::disabled", ""], 
					function(resp){
				
						// temporarily turn off the Chrome fix
						// this is needed to allow reloading, without triggering a dialog in Chrome preventing it!
						$(window).off('beforeunload'); 
				
						$.ajax({
							"type": "POST",
							"url": WEBSERV_URL+"/api/login",
							"data": {
								"username": "admin",
								"password": resp["Password"],
								"dummy": getUniqueNumber()
							},
							"dataType": "xml", // get response as xml
							"success": function(xml) {
								
								var sResp = fn.getDbResponse(xml);
						 		if (sResp == 'Access denied'){
						 			fn.closeDialog();
						 			fn.message(sResp, sResp, function(){
						 				lexitReload();
						 			});
						 		}
						 		else {
						 			
						 			lexitusers.updateOverviewOfUsersAndRoles( function(){lexitusers.showMenu();} );
						 																	 		
						 		}
						 	},
							"error": function(jqXHR, textStatus, errorThrown){
								
								fn.message(lang.error, lang.failed+": " +	textStatus+" "+errorThrown);
							}
						});
						
						
				
					},
					function(){
						lexitReload();
					}
			);
			
			// set password type
			setTimeout(	function(){	
				$("div[id^='dialog-message']").find("input#prompt_password").attr("type", "password");
				fn._activeEnterForThisDialog( $("div[id^='dialog-message']").attr("id") );
			}, 100);
		}

		// global spy mode (logging info)
		else if (bSpyMode) {
			
			buildSpy();
		}

		// reset user rights
		else if (bResetUserRights){
			var url = WEBSERV_URL+"/api/reset_user_rights";

			$.ajax({
				"type": "GET",
				"url": url,
				"data": {
					"dummy": getUniqueNumber()
				},
				"dataType": "xml", // get response as xml
				"success": function(xml) {
					var sResp = fn.getDbResponse(xml);
					fn.message(lang.reset, lang.response+ ": " + sResp);
				},
				"error": function(jqXHR, textStatus, errorThrown){

					fn.message(lang.error, lang.failed+": " +	textStatus+" "+errorThrown);
				}
			});
		}
		
		

		// last case: 
		// if 'db' parameter is NOT set, show the list of project
		// but if 'db' parameter is set, open that project
		
		// in test mode (development)
		else if (bTest) {
			$.getScript("projects_overview.js")
				.done(function(){

					// The ajax call gets the list of declared projects out of the projects overview file.
					// As a second step, we call a function which generates a list of all projects, as some might not have been declared.
					// In the end, this function will call initialize();
					getConfigFilesList();

				})
				.fail(function(jqxhr, settings, exception){
					fn.message(lang.error, lang.loading_projects_list_failed +"<br><br>"+ lang.error +": ["+exception+"]<BR><BR>");
				});
		}

		// in normal mode (production)
		else {
			var url = WEBSERV_URL+"/api/get_projects_overview";

			$.ajax({
				"type": "GET",
				"url": url,
				"dataType": "script",
				"data": {
					"dummy": getUniqueNumber()
				},
				"success": function(){

					// The ajax call gets the list of declared projects out of the projects overview file.
					// As a second step, we call a function which generates a list of all projects, as some might not have been declared.
					// In the end, this function will call initialize();
					getConfigFilesList();

				},
				"error": function(jqxhr, settings, exception){
					fn.message(lang.error, lang.loading_projects_list_failed +"<br><br>"+ lang.error +": ["+exception+"]<BR><BR>");
				}

			});

		}
	}


	// compute operating mode

	function computeOperatingMode(){
		
		// administrator mode		
		bAdmin = (paramsHash!=null && paramsHash.get("db")=='admin');

		// Are we in development (test) mode?
		// if so, we'll be loading the file from webcontent (with $.getScript)
		// if not, we'll be loading the file from the configuration directory (with ajax call to webservice, which is the normal mode)
		bTest = (paramsHash!=null && paramsHash.get("test")=='true');

		// are we getting a look into the active users list?
		bSpyMode = (paramsHash!=null && paramsHash.get("db")=='spy');

		// are we resetting the user rights?
		bResetUserRights = (paramsHash!=null && paramsHash.get("db")=='reset_user_rights');
	}
	
		
	// spy mode
		
	function buildSpy(){
		
		var url = WEBSERV_URL+"/api/get_users";
		
		$.ajax({
			type: "GET",
			url: url,
			data: {},
			dataType: "xml",
			contentType: "application/x-www-form-urlencoded;charset=UTF-8",
			success: function(xml) {
				
				// build the table if it doesn't exist yet
				if ( !$("#spytable").elementExists() ) {
					var spyDiv = $("<div></div>")
						.attr("id", "#spytable");
				
					var spyTable = $("<table></table>")
						.attr("id", "spytable")
						.addClass("display")
						.attr("cellspacing", "0")
						.css("width", "90%");
					
					var thead = $("<thead></thead>");
					var thead_tr = $("<tr></tr>");
					thead_tr.append( $("<th></th>").text("project_name") );
					thead_tr.append( $("<th></th>").text("active_user") );
					thead_tr.append( $("<th></th>").text("session_id") );
					thead_tr.append( $("<th></th>").text("active_tab") );
					thead_tr.append( $("<th></th>").text("last_active") );
					thead_tr.append( $("<th></th>").text("status") );
					thead.append(thead_tr);
					spyTable.append(thead);
					
					var tfoot = $("<tfoot></tfoot>");
					var tfoot_tr = $("<tr></tr>");
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot.append(tfoot_tr);
					spyTable.append(tfoot);
					
					var tbody = $("<tbody></tbody>");
					
					spyTable.append(tbody);
					spyDiv.append(spyTable);				
					$("#dynamic").append(spyDiv);
					
					spyDiv
					.css("position", "absolute")
					.css("top", "100px")				
					.css("width", "80%");
					
					oSpyTable = $('#spytable').DataTable({
						"dom": '<"top"f>t',
						"pageLength": 100,
						"language": {
							"search": "Filter: "
						}
					}).column(2).order('desc').draw();
					
					
					// remove unneeded links
					$("#headerlinks").hide();
					
				}
				
				// remove rows from previous cycle
				oSpyTable.rows().remove();
				
				// add the current info to the table
				$(xml).find("user").each(function(){
					
					var UsersItems = $(this).find("item");
					
					oSpyTable.row.add([
						UsersItems.eq(0).text(),
						UsersItems.eq(1).text(),
						UsersItems.eq(2).text(),
						UsersItems.eq(3).text(),
						UsersItems.eq(4).text(),
						UsersItems.eq(5).text()
						]);
					});
				
				// sort by column 'last_active'
				oSpyTable.draw();					
				
				// refresh after few seconds
				setTimeout(function(){ buildSpy(); }, 2000);
			},
			error: function(jqXHR, textStatus, errorThrown){
				fn.message(lang.error, lang.loading_xml_failed +": "+textStatus+" "+errorThrown);
			}
		});
	};


	function sayHello(){

		var url = WEBSERV_URL+"/hello/lexit";

		$.ajax({

	// get internal separator in use in webservice  
	// and set the same separator in this client
	
	function setInternalSeparator(fnCallback){

		$.ajax({
			"async": false, // needed to block code execution while awaiting the server response
			"type": "GET",

				console.log("Raw response: ", jqxhr.responseText);							}

	// tell the webservice which tab is currently active
	// in the current session

	function sendActiveTabIdToService(sPageId){
		
		if (	USERNAME == 'null' // this happens when the fn.setCurrentUser() function returned null username (as a string indeed)
				|| 
				paramsHash == null || paramsHash.get("db") == null || paramsHash.get("db") == 'spy'
			)
			return;

		var url = WEBSERV_URL+"/api/set_active_tab_id";

		$.ajax({
			"async": false, // needed to block code execution while awaiting the server response
			"type": "GET",
			"url": url,
			"dataType": "xml", // get response as xml
			"data": {
				"db_name": paramsHash.get("db"),
				"active_tab_id": sPageId,
				"dummy": getUniqueNumber()
			},
			"success": function(xml){
				// nothing to do
			},
			"error": function(jqxhr, settings, exception){
				
				// connection failed
				if (jqxhr.responseText.indexOf("Connection failed")>=0){
					
					// use timeout to allow all error messages to be shown:
					// we will then close all dialogs
					// and given one single USEFUL message to the user
					
					setTimeout(function(){
						
						fn.closeDialog();
						fn.message(lang.error, "<B>" + jqxhr.responseText + "</B>",
							function () {
								lexitReload();
							}
						);
						
					}, 1000);
					
				} 
				
				// if the user has logged into another account in another tab, this will cause the current tab to misbehave
				// so we reload the page, which will trigger the user to log in again
				else if (jqxhr.responseText != "Permission denied to "+fn.getCurrentUser()){
					throw new Error("Execution stopped: "+lang.saving_active_tab_failed); // prevents infinite loop!
				}
				
				// otherwise, an error in this function indicates a problem with the webservice
				// we we must tell the user firt about the error before reloading the page
				else {						
					fn.closeDialog();
					fn.message(lang.error, lang.saving_active_tab_failed+ "<br><br>" +jqxhr.responseText+ ": ["+exception+"]",
						function () {
							lexitReload();
						}
					);					
				}				 
			}
		});
	}
	
	
	// Get full list of projects config files from server.
	// We'll need this to be able to show projects which are not declared (yet?) in the projects overview file:
	// the list will lack descriptions, but at least the projects will be shown and will be clickable!
	
	function getConfigFilesList(){

		// if some project was selected already, no need to get the list, 
		// initialize straight away!
		if (paramsHash!=null &&	paramsHash.get("db")!=null){
			initialize();
		}
		else {

			// this might take a while, so put spinner
			lexutil.showSpinner("#dynamic", true);
			
			var url = WEBSERV_URL+"/api/get_configfiles_list";
			
			$.ajax({
				"type": "GET",
				"url": url,
				"dataType": "xml", // get response as xml
				"data": {
					"dummy": getUniqueNumber()
				},
				"success": function(xml){
					
					var sList = fn.getDbResponse(xml);
					aFullConfigFilesList = sList.split(ARG_INTERNAL_SEPARATOR);

					// remove spinner
					lexutil.removeSpinner("#dynamic");
					
					// go!
					initialize();
				},
				"error": function(jqxhr, settings, exception){
					fn.message(lang.error, lang.reading_the_list_of_config_files_failed+ "<br><br>" +lang.error+ ": ["+exception+"]");
				}
			});

		}

	}

	// Initialize the application.
	// This happens once the libraries are fully loaded and we have a list of all projects 
	// ( which is which this function will be called by getConfigFilesList )
	
	function initialize(){	
		
		// generate unique id for this page
		// we will need this to detect page focus/blur in a reliable way
		var sPageId = getUniqueNumber();
		$("#page_id").attr("name", sPageId);
		$.cookie('active_lexit_window', sPageId);
		sendActiveTabIdToService(sPageId);
		
		// user instruction for accessing tables
		$("#indicator").empty().append(
				$("<span></span>")
				.html(lang.choose_a_table)
				);
		
		// get url parameters		
		if (paramsHash == null || paramsHash.get("db") == null) {
			showListOfProjects();
		}
		else {			
			// Normal case: start opening project
		
			// Assign key functions
			// This needs to be called here because it has global scope
			// and recalling it at each new table creation will alter other key functions 
			// which then malfunction (because of unbinds)
			kf.addKeyFunctions();
			
			
			// load the specific client configuration file for the required database
			// and get the list of tables (getScript never reads this file from cache)
			
			
			// test mode (development)
			if (bTest) {
				$.getScript(paramsHash.get("db")+".config.js")
				.done(function(){
					
					var oFiltersAndSettings = getTableFiltersAndSettings(paramsHash);
					ts.getListOfTables( paramsHash.get("table"), 
							oFiltersAndSettings.contentToMatch , oFiltersAndSettings.extraSettings  );
					
					// prevent Chrome bug (sometimes pressing backslash causes navigating away)
					if (bowser.chrome)
						$(window).bind('beforeunload', function(){   
							return false;
						});
				})
				.fail(function(jqxhr, settings, exception){
					fn.message(lang.error, lang.opening_config_file_failed+ "<br><br>" +lang.error+ ": ["+exception+"]<BR><BR>");
					throw new Error("Execution stopped: "+lang.opening_config_file_failed);
				});
			}
			
			// normal mode (production)
			else {
				var url = WEBSERV_URL+"/api/get_configfile";
				
				$.ajax({
					"type": "GET",
					"url": url,
					"dataType": "script",
					"data": {
						"db_name": paramsHash.get("db"),
						"dummy": getUniqueNumber()
					},
					"success": function(){
						
						var oFiltersAndSettings = getTableFiltersAndSettings(paramsHash);
						ts.getListOfTables( paramsHash.get("table"), 
								oFiltersAndSettings.contentToMatch , oFiltersAndSettings.extraSettings );
						
						// prevent Chrome bug (sometimes pressing backslash causes navigating away)
						if (bowser.chrome)
							$(window).bind('beforeunload', function(){   
								return false;
							});
					},
					"error": function(jqxhr, settings, exception){
						fn.message(lang.error, lang.opening_config_file_failed+ "<br><br>" +lang.error+ ": ["+exception+"]<BR><BR>");
						throw new Error("Execution stopped: "+lang.opening_config_file_failed);
					}
				});
			}
			
			
			
			// show message or warning for this project, if available
			
			var oProjectObject = getProjectObject(paramsHash.get("db"));

			// set a default project name for display on screen (and set front character in uppercase)
			// this default name might be overwritten by configuration in project_overview.js, if some project 'name' was set there
			var sProjectName = paramsHash.get("db").substring(0,1).toUpperCase()+paramsHash.get("db").substring(1);

			if (typeof oProjectObject != 'undefined') {
				
				// message
				if (typeof oProjectObject["message"] != 'undefined') {
					var sWarning = oProjectObject["message"];
					var bPrivate = (typeof oProjectObject["private"] != 'undefined') ?
						oProjectObject["private"] : false; // default is 'false'
					var fnMsgCallback = (typeof oProjectObject["message_callback"] != 'undefined') ?
								oProjectObject["message_callback"] : null;
						 
					// show warning message if available
					if (	sWarning != '' &&   
							// except if it should be kept private to home
							!(bPrivate && (document.URL).regexIndexOf( INL_HOMEURL )<0 ) 
						){
						fn.message(paramsHash.get("db"), sWarning, fnMsgCallback);
						console.log("warning for project '"+paramsHash.get("db")+"': "+sWarning);
						}
				}
				
				// redirect to other URL (rare, but it has been required in the past)
				if (typeof oProjectObject["redirect"] != 'undefined') {
					window.location.href = oProjectObject["redirect"];
				}

				// is some project name was set, overwrite the default one
				if (typeof oProjectObject["name"] != 'undefined') {
					sProjectName = oProjectObject["name"];
				}
			}


			// show the project name at the top of the screen
			fn.setProjectTitle(sProjectName);
			
			// statistics
			lexutil.setStatistics();
		}
		
	};

	// called by initialize()
	
	
	// get table filters from url if available (... &filter_a=... & filter_b=...)
	function getTableFiltersAndSettings(paramsHash){
		
		var oContentToMatch = new Array();
		var oExtraSettings = new Array();
		for (var i=0; i<paramsHash.keys().length; i++) {
			var sOneParam = paramsHash.keys()[i];
			// read all parameters, except 'db' and 'table', since we process those elsewhere
			if ( $.inArray(sOneParam, ["db", "table"])<0 ) {
				// table setting parameters
				if ($.startsWith(sOneParam, "setting.")) {
					var sTrueSettingName = sOneParam.replace("setting.", "");
					oExtraSettings[sTrueSettingName] = paramsHash.get(sOneParam);					
				}
				// table filters
				else {
					oContentToMatch[sOneParam] = paramsHash.get(sOneParam);
				}				
			}
		}
		
		return { 
			contentToMatch: oContentToMatch,
			extraSettings: oExtraSettings
		};
	}
	
	
	
	
	// get technical database info and show it in a pop-up 
	function showDatabaseInfo(sDbName){
		
		var url = WEBSERV_URL+"/api/get_dbinfo";
		
		$.ajax({
			"type": "GET",
			"url": url,
			"data": {
				"db": sDbName,
				"dummy": getUniqueNumber()
			},
			"dataType": "xml", // get response as xml
			"success": function(xml) {
				var sResp = fn.getDbResponse(xml);
		 		fn.message(lang.database_info, sResp);
		 	},
			"error": function(jqXHR, textStatus, errorThrown){
				
				fn.message(lang.error, "'"+sDbName+"' " +lang.file_is_missing+ ": " + textStatus+" "+errorThrown);
			}
		});
		
	}

	
	// generate a welcome page with a project overview 
	// (projects have to be declared and described in file 'projects_overview.js' so as to be show here)
	function showListOfProjects(){
		
		var sCurrentURL = document.URL;
		
		// keep this list private to internal environment
		if ( sCurrentURL.regexIndexOf( INL_HOMEURL )>-1 || bTest) {

			$("#indicator").empty().append(
				$("<div></div>")
					.attr("id", "welcome_in_lexit")
					.html("<h2>" +lang.welcome+ "</h2>&nbsp;&nbsp;&nbsp;" +lang.choose_a_project+ "!<br>")
			);
			
			var docOpenTitle = $("<span></span>")
				.addClass("lexit_menu_section")
				.html("<b>" +lang.production+ "</b>");
			var docOpen = $("<table></table>")
				.addClass("lexit_menu_section")
				.attr("id", "lexit_menu_production_section");
			
			var goodiesTitle = $("<span></span>")
				.addClass("lexit_menu_section")
				.html("<b>" +lang.goodies+ "</b>");
			var goodies = $("<table></table>")
				.addClass("lexit_menu_section")
				.attr("id", "lexit_menu_goodies_section");
			
			var docDevelopmentTitle = $("<span></span>")
				.addClass("lexit_menu_section")
				.html("<b>" +lang.in_development+ "</b>");
			var docDevelopment = $("<table></table>")
				.addClass("lexit_menu_section")				
				.attr("id", "lexit_menu_development_section");
			
			var docClosedTitle = $("<span></span>")
				.addClass("lexit_menu_section")
				.html("<b>" +lang.project_closed+ "</b>");
			var docClosed = $("<table></table>")
				.addClass("lexit_menu_section")
				.attr("id", "lexit_menu_closed_section");
			
			var docUnknownTitle = $("<span></span>")
				.addClass("lexit_menu_section")
				.html("<b>" +lang.project_unknown+ "</b>");
			var docUnknown = $("<table></table>")
				.addClass("lexit_menu_section")
				.attr("id", "lexit_menu_unknown_section");
			
			
			// process list of all config files
			var aKnownConfigFilesList = new Array();
			
			// get list of known projects in projects overview
			for (var i=0; i<aProjectList.length; i++) {
				aKnownConfigFilesList.push(aProjectList[i]["config_filename"]);				
			}
			
			// now, if some configfile is no part of the projects overview list, 
			// it will be added to it as part of the 'unknown projects' category
			// (so it will appear as such in the menu)
			for (var i=0; i<aFullConfigFilesList.length; i++) {

				var sOneConfigFile = aFullConfigFilesList[i];
				
				// if server return some description/message, set it

				var aOneConfigFile = sOneConfigFile.split(":::");
				var sOneDescription = lang.unknown;	// default: 'unknown'
				if (aOneConfigFile.length>1){
					sOneConfigFile  = aOneConfigFile[0];
					sOneDescription = aOneConfigFile[1];
				}

				// add unknown project

				if (aKnownConfigFilesList.indexOf(sOneConfigFile) < 0) {
					aProjectList.push({
						"name": sOneConfigFile,
						"config_filename": sOneConfigFile,
						"description": sOneDescription,
						"unknown": true
				 	});
				}
			}
			
			
			// build menu now!
			for (var i=0; i<aProjectList.length; i++){

				// set project name to be rendered and a project link to be clicked upon

				var sProjectLinkPart = aProjectList[i]["config_filename"];
				var sProjectLink = sCurrentURL.substring(0, sCurrentURL.indexOf("/lexit2"))+"/lexit2/?db="+sProjectLinkPart+( sCurrentURL.indexOf("test=true")>-1 ? "&test=true":"")+
					( sCurrentURL.indexOf("lang=")>-1 ? "&lang="+sCurrentURL.substring(sCurrentURL.indexOf("lang=")+"lang=".length, sCurrentURL.indexOf("lang=")+"lang=".length+2):"");
				var sProjectName = (typeof aProjectList[i]["name"] != 'undefined' ? aProjectList[i]["name"] : sProjectLinkPart);
				
				var sProjectDescription =
					"<td style='text-align: right; width: 37%'>"+
					"<A href='"+sProjectLink+"'><B>"+sProjectName+
					"</B></A></td>"+
					"<td style='text-align: right; width: 3%; vertical-align: bottom;'>"+
					(typeof aProjectList[i]["goody"] == 'undefined' ? 
							"<A style='text-decoration: none; color: #A4A4A4;' "+ 
							"   title='"+sProjectName+"' "+
							"   href='#' "+
							"   onclick='showDatabaseInfo(\""+sProjectLinkPart+"\"); return false;' "+
							"   target='_blank'><span class='ui-icon ui-icon-info'></span></A>" : "")+
					"</td>"+
					"<td style='text-align: left; width: 60%'>" +
					(typeof aProjectList[i]["description"] != 'undefined' && aProjectList[i]["description"] != "" ? 
						" : <I>"+aProjectList[i]["description"]+"</I>" : "") + 
					"</td>";
				
				var eProjectDiv = $("<tr></tr>").html(sProjectDescription);
				
				// Put the project in the right category:
				
				if (typeof aProjectList[i]["goody"] != 'undefined' && aProjectList[i]["goody"]) {
					goodies.append(eProjectDiv)
				}
					
				// project is closed
				else if (typeof aProjectList[i]["closed"] != 'undefined' && aProjectList[i]["closed"]) {
					docClosed.append(eProjectDiv)
				}
				
				// project is unknown
				else if (typeof aProjectList[i]["unknown"] != 'undefined' && aProjectList[i]["unknown"]) {
					docUnknown.append(eProjectDiv);
				}
				
				// project is open
				else {
					// production
					if (typeof aProjectList[i]["production"] != 'undefined' && aProjectList[i]["production"])
						docOpen.append(eProjectDiv);
					// development
					else
						docDevelopment.append(eProjectDiv);
				}
			}
			
			// add each table part and
			// (make sure each table is visible even when it's empty) 
			
			$("#indicator").append(
				$("<div></div>")
					.attr("id", "welcome_menu_tables")
			);
							
			$("#indicator").find("#welcome_menu_tables")
				.append(docOpenTitle)
				.append(_deEmptyMenuList(docOpen))
				.append($("<br>"))		
				.append(goodiesTitle)
				.append(_deEmptyMenuList(goodies))
				.append($("<br>"))
				.append(docDevelopmentTitle)
				.append(_deEmptyMenuList(docDevelopment))
				.append($("<br>"))
				.append(docClosedTitle)
				.append(_deEmptyMenuList(docClosed))	
				.append($("<br>"))
				.append(docUnknownTitle)
				.append(_deEmptyMenuList(docUnknown));
			
			
		}
		else {
			fn.message(lang.error, lang.access_denied);
		}
		
	}
	
	// subroutine: make sure an empty menu list is visible, by addind an empty line
	function _deEmptyMenuList(docList){
		
		var eEmptyCell = "<td style='text-align: right; width: 400px'>&nbsp;</td>"+
		"<td>&nbsp;</td><td style='text-align: left; width: 700px'>&nbsp;</td>";
		var eEmptyLine = $("<tr></tr>").html(eEmptyCell);
		
		return ( !$(docList).find("tr").length ) ? docList.append(eEmptyLine) : docList;
		
	}
	
	
	// get all the properties belonging to the description of a project
	function getProjectObject(sDbName){
		
		var oObjectToReturn;
		
		for (var i=0; i<aProjectList.length; i++) {
			if (aProjectList[i]["config_filename"] != sDbName) {
				continue;
			}
			else {
				oObjectToReturn = new lexutil.cloneObject(aProjectList[i]);
				break;
			}
		}
		return oObjectToReturn;
	}
	
	function lexitReload(){
		// temporarily turn off the Chrome fix
		// this is needed to allow reloading, without triggering a dialog in Chrome preventing it!
		$(window).off('beforeunload');
		location.reload();
	}
