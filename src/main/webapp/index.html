	<!-- 
	
	Lex'it javascript functions are spread among different name spaces:
	
	asr	: advanced search and replace function (see also: ssr)
	cm  : Context menus
	conf: Configurator (process configuration)
	fn	: User Functions, the functions designed to configurate the client
	gui : Graphic User Interface functions
	head: Table header
	kf  : Key functions
	mt	: Multitable (table properties registration, taking care 
	      of doing that for more than one table at once)
	refr: Refresh table when browser tab is regaining focus 
	row : Row selection
	sf  : Search functions
	ssr	: simple search and replace function (see also: asr)
	tb	: Table Builder, builds the table html frame 
	      and the Datatable object
	td  : Functions about table details
	ts  : Functions about table selection
	un	: Undo function
	-->

	var oSpyTable;
	
	// spy mode 
	function buildSpy(){
		
		var url = WEBSERV_URL+"/table/get_users"; 			
		
		$.ajax({
			type: "GET",
			url: url,
			data: {},
			dataType: "xml",
			contentType: "application/x-www-form-urlencoded;charset=UTF-8",
			success: function(xml) {
				
				// build the table if it doesn't exist yet
				if ( !$("#spytable").elementExists() )
					{
					var spyDiv = $("<div></div>")
					.attr("id", "#spytable");
				
					var spyTable = $("<table></table>")
						.attr("id", "spytable")
						.addClass("display")
						.attr("cellspacing", "0")
						.css("width", "90%");
					
					var thead = $("<thead></thead>");
					var thead_tr = $("<tr></tr>");
					thead_tr.append( $("<th></th>").text("project_name") );
					thead_tr.append( $("<th></th>").text("active_user") );
					thead_tr.append( $("<th></th>").text("session_id") );
					thead_tr.append( $("<th></th>").text("last_active") );
					thead_tr.append( $("<th></th>").text("status") );
					thead.append(thead_tr);
					spyTable.append(thead);
					
					var tfoot = $("<tfoot></tfoot>");
					var tfoot_tr = $("<tr></tr>");
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot_tr.append( $("<th></th>").text() );
					tfoot.append(tfoot_tr);
					spyTable.append(tfoot);
					
					var tbody = $("<tbody></tbody>");
					
					spyTable.append(tbody);
					spyDiv.append(spyTable);				
					$("#dynamic").append(spyDiv);
					
					spyDiv
					.css("position", "absolute")
					.css("top", "100px")				
					.css("width", "80%");
					
					oSpyTable = $('#spytable').DataTable({
						"dom": '<"top"f>t',
						"pageLength": 100
						}).column(2).order('desc').draw();
					
					}
				
				// remove rows from previous cycle
				oSpyTable.rows().remove();
				
				// add the current info to the table
				$(xml).find("user").each(function(){
					
					var UsersItems = $(this).find("item");
					
					oSpyTable.row.add([
						UsersItems.eq(0).text(),
						UsersItems.eq(1).text(),
						UsersItems.eq(2).text(),
						UsersItems.eq(3).text(),
						UsersItems.eq(4).text()
						]);
					});
				
				// sort by column 'last_active'
				oSpyTable.draw();					
				
				// refresh after few seconds
				setTimeout(function(){ buildSpy(); }, 2000);
				},
			error: function(jqXHR, textStatus, errorThrown){
				fn.message("Fout", "XML laden mislukt: "+textStatus+" "+errorThrown);
				}
		});
	};
	
	
	// initialize the application
	// (this happens once the libraries are fully loaded)
	function initialize(){	
		
		// set current user name
		fn.setCurrentUser();
		
		if (INL_HOMEURL != "inl.loc")
			{
			fn.message("Waarschuwing", "Als HOME-URL is nu ingesteld: "+INL_HOMEURL);
			}
		
		// generate unique id for this page
		// we will need this to detect page focus/blur in a reliable way
		$("#page_id").attr("name", getUniqueNumber());
		$.cookie('active_lexit_window', $("#page_id").attr("name"));
		
		// user instruction for accessing tables
		$("#indicator").empty().append(
				$("<span></span>")
				.html("Kies een tabel: <I>(+ CTRL om tabel toe te voegen) (+ SHIFT voor nieuwe tab)</I>")
				);
		
		// get url parameters		
		if (paramsHash == null || paramsHash.get("db") == null)
			{
			showListOfProjects();
			}
		else
			{			
			// Assign key functions
			// This needs to be called here because it has global scope
			// and recalling it at each new table creation will alter other key functions 
			// which than malfunction (because of unbinds)
			kf.addKeyFunctions();			
			
			
			// load the specific client configuration file for the required database
			// and get the list of tables (getScript never reads this file from cache)
			
			
			// test mode (development)
			if (bTest)
				{
				$.getScript(paramsHash.get("db")+".config.js")
				.done(function(){
					
					var oFiltersAndSettings = getTableFiltersAndSettings(paramsHash);
					ts.getListOfTables( paramsHash.get("table"), 
							oFiltersAndSettings.contentToMatch , oFiltersAndSettings.extraSettings  );
					
					// prevent Chrome bug (sometimes pressing backslash causes navigating away)
					if (bowser.chrome)
						$(window).bind('beforeunload', function(){   
							return false;
							});
					})
				.fail(function(jqxhr, settings, exception){
					fn.message("Fout", "Het configuratiebestand '<i>"+paramsHash.get("db")+"</i>' bestaat niet of het bevat fouten.<br><br>Fout: ["+exception+"]");
					});
				}
			
			// normal mode (production)
			else
				{
				var url = WEBSERV_URL+"/table/get_configfile"; 			
				
				$.ajax({
					"type": "GET",
					"url": url,
					"dataType": "script",
					"data": {
						"db_name": paramsHash.get("db"),
						"dummy": getUniqueNumber()
					},
					"success": function(){
						
						var oFiltersAndSettings = getTableFiltersAndSettings(paramsHash);
						ts.getListOfTables( paramsHash.get("table"), 
								oFiltersAndSettings.contentToMatch , oFiltersAndSettings.extraSettings );
						
						// prevent Chrome bug (sometimes pressing backslash causes navigating away)
						if (bowser.chrome)
							$(window).bind('beforeunload', function(){   
								return false;
							});
					},
					"error": function(jqxhr, settings, exception){
						fn.message("Fout", "Het configuratiebestand '<i>"+paramsHash.get("db")+"</i>' bestaat niet of het bevat fouten.<br><br>Fout: ["+exception+"]");
					}
					});
				}
			
			
			
			// show the project name at the top of the screen
			var sProjectName = paramsHash.get("db").substring(0,1).toUpperCase()+paramsHash.get("db").substring(1);
			
			fn.setProjectTitle(sProjectName);
			
			
			// show message or warning for this project, if available
			var oProjectObject = getProjectObject(paramsHash.get("db"));
			if (typeof oProjectObject != 'undefined')
				{
				if (typeof oProjectObject["message"] != 'undefined')
					{
					var sWarning = oProjectObject["message"];
					var bPrivate = (typeof oProjectObject["private"] != 'undefined') ?
						oProjectObject["private"] : false; // default is 'false' 						
						 
					// show warning message if available
					if (	sWarning != '' &&   
							// except if it should be kept private to home
							!(bPrivate && (document.URL).indexOf( INL_HOMEURL )<0 ) 
						)
						fn.message(paramsHash.get("db"), sWarning);
					}
				}		
			}
		
	};
	
	
	function setInternalSeparator(){
		
		var url = WEBSERV_URL+"/table/get_neutral_separator"; 			
		
		$.ajax({
			"type": "GET",
			"url": url,
			"dataType": "xml", // get response as xml
			"data": {
				"dummy": getUniqueNumber()
			},
			"success": function(xml){
				ARG_INTERNAL_SEPARATOR = fn.getDbResponse(xml);
			},
			"error": function(jqxhr, settings, exception){
				fn.message("Fout", "Het ophalen van de Interne separator string is mislukt.<br><br>Fout: ["+exception+"]");
			}
		});
	}
	
	
	// get table filters from url if available (... &filter_a=... & filter_b=...)
	function getTableFiltersAndSettings(paramsHash){
		
		var oContentToMatch = new Array();
		var oExtraSettings = new Array();
		for (var i=0; i<paramsHash.keys().length; i++)
			{
			var sOneParam = paramsHash.keys()[i];
			// read all parameters, except 'db' and 'table', since we process those elsewhere
			if ( $.inArray(sOneParam, ["db", "table"])<0 )
				{
				// table setting parameters
				if ($.startsWith(sOneParam, "setting."))
					{
					var sTrueSettingName = sOneParam.replace("setting.", "");
					oExtraSettings[sTrueSettingName] = paramsHash.get(sOneParam);					
					}
				// table filters
				else
					{
					oContentToMatch[sOneParam] = paramsHash.get(sOneParam);
					}				
				}
			}
		
		return { 
			contentToMatch: oContentToMatch,
			extraSettings: oExtraSettings
			};
	}
	
	// generate a welcome page with a project overview 
	// (projects have to be declared and described in file 'projects_overview.js' so as to be show here)
	function showListOfProjects(){
		
		var sCurrentURL = document.URL;
		
		// keep this list private to internal environment
		if ( sCurrentURL.indexOf( INL_HOMEURL )>-1 || bTest)
			{
			$("#indicator").empty().append(
					$("<span></span>")
					.html("<br><h2>Welkom in Lex'it</h2>Kies een project:<br><br>")
					);
			
			var docOpenTitle = $("<span></span>").html("<b>Productie</b>");
			var docOpen = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#D0F5A9");
			
			var goodiesTitle = $("<span></span>").html("<b>Goodies en tools</b>");
			var goodies = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#A9E2F3");
			
			var docDevelopmentTitle = $("<span></span>").html("<b>In ontwikkeling</b>");
			var docDevelopment = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#EFEFFB");
			
			var docClosedTitle = $("<span></span>").html("<b>Afgesloten</b>");
			var docClosed = $("<table></table>")
				.css("border", "dotted black 1px")
				.css("background", "#F8E0E0");
			
			
			
			for (var i=0; i<aProjectList.length; i++)
				{
				var sProjectLinkPart = aProjectList[i]["config_filename"];
				var sProjectLink = sCurrentURL.substring(0, sCurrentURL.indexOf("/lexit2"))+"/lexit2/?db="+sProjectLinkPart;
				
				var sProjectDescription =
					"<td style='text-align: right; width: 400px'>"+
					"<A href='"+sProjectLink+"'><B>"+aProjectList[i]["name"]+
					"</B></A></td><td>" +					 
					"</td><td style='text-align: left; width: 700px'>" +
					(typeof aProjectList[i]["description"] != 'undefined' && aProjectList[i]["description"] != "" ? 
						" : <I>"+aProjectList[i]["description"]+"</I>" : "") + 
					"</td>";
				
				var eProjectDiv = $("<tr></tr>").html(sProjectDescription);
				
				// Put the project in the right category:
				
				if (typeof aProjectList[i]["goody"]  != 'undefined' && aProjectList[i]["goody"])
					{
					goodies.append(eProjectDiv)
					}
					
				// project is closed
				else if (typeof aProjectList[i]["closed"]  != 'undefined' && aProjectList[i]["closed"])
					{
					docClosed.append(eProjectDiv)
					}
				
				// project is open
				else
					{
					// production
					if (typeof aProjectList[i]["production"]  != 'undefined' && aProjectList[i]["production"])
						docOpen.append(eProjectDiv);
					// development
					else
						docDevelopment.append(eProjectDiv);
					}
				}
				
			$("#page").append(docOpenTitle);
			$("#page").append(docOpen);
			$("#page").append($("<br>"));			
			$("#page").append(goodiesTitle);
			$("#page").append(goodies);
			$("#page").append($("<br>"));
			$("#page").append(docDevelopmentTitle);
			$("#page").append(docDevelopment);
			$("#page").append($("<br>"));
			$("#page").append(docClosedTitle);
			$("#page").append(docClosed);
			
			}
		else
			{
			fn.message("Fout", "Geen toegang");
			}
		
	}
	
	
	// get all the properties belonging to the description of a project
	function getProjectObject(sProjectName){
		
		var oObjectToReturn;
		
		for (var i=0; i<aProjectList.length; i++)
		{
			if (aProjectList[i]["config_filename"] != sProjectName)
				{
				continue;
				}
			else
				{
				oObjectToReturn = new cloneObject(aProjectList[i]);
				break;
				}
		}
		return oObjectToReturn;
	}
